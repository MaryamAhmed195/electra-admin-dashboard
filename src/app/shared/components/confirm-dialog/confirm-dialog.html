<div class="modal d-block" tabindex="-1" role="dialog">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content border-0 shadow-lg rounded-4">
      <div class="modal-header border-0">
        <h5 class="modal-title fw-bold text-dark">Confirm Delete</h5>

        <button type="button" class="btn-close" aria-label="Close"></button>
      </div>

      <div class="modal-body text-secondary">
        <p class="mb-0">
          {{ message() }}
        </p>
      </div>

      <div class="modal-footer border-0">
        <button type="button" class="btn btn-light" (click)="handleCancel()">Cancel</button>

        <button type="button" class="btn btn-danger" (click)="handleConfirm()">Delete</button>
      </div>
    </div>
  </div>
</div>
