<div class="container py-5">
  @if (product()) {
    <h1>{{ product()?.name }}</h1>

    <p>Price: ${{ product()?.price }}</p>

    <p>Stock: {{ product()?.stock }}</p>

    <p>Category ID: {{ product()?.categoryId }}</p>

    @if (product()?.isActive) {
      <span>Active</span>
    } @else {
      <span>Inactive</span>
    }
  } @else {
    <h2>Product not found</h2>
    <p>The product you are looking for does not exist.</p>
  }
</div>
